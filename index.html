<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080A12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Atlas Fit">
  <meta name="description" content="App pessoal de treino, evolução, carga, descanso e histórico.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Atlas Fit — Treino pessoal</title>
</head>
<body>
  <noscript>
    <div class="noscript">Este app precisa de JavaScript para registrar seus treinos.</div>
  </noscript>

  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-card">
      <div class="brand-mark">AF</div>
      <p class="eyebrow">Personal Training OS</p>
      <h1>Atlas Fit</h1>
      <p>Treino, carga, descanso e evolução em um só lugar.</p>
    </div>
  </div>

  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p id="top-eyebrow" class="eyebrow">Hoje</p>
        <h1 id="top-title">Atlas Fit</h1>
      </div>
      <button id="quick-action" class="icon-button" type="button" aria-label="Ação rápida">＋</button>
    </header>

    <main id="main" class="main">
      <section id="page-home" class="page active" data-title="Atlas Fit" data-eyebrow="Dashboard"></section>
      <section id="page-train" class="page" data-title="Treino" data-eyebrow="Sessão ativa"></section>
      <section id="page-progress" class="page" data-title="Evolução" data-eyebrow="Métricas"></section>
      <section id="page-library" class="page" data-title="Biblioteca" data-eyebrow="Construtor"></section>
      <section id="page-settings" class="page" data-title="Ajustes" data-eyebrow="Backup e personalização"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button class="nav-item active" type="button" data-page="home"><span>⌂</span><strong>Início</strong></button>
      <button class="nav-item" type="button" data-page="train"><span>◉</span><strong>Treino</strong></button>
      <button class="nav-item" type="button" data-page="progress"><span>↗</span><strong>Evolução</strong></button>
      <button class="nav-item" type="button" data-page="library"><span>▦</span><strong>Biblioteca</strong></button>
      <button class="nav-item" type="button" data-page="settings"><span>⚙</span><strong>Ajustes</strong></button>
    </nav>
  </div>

  <div id="rest-timer" class="rest-timer hidden" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
